<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="70%">
      <stop offset="0" stop-color="#1a3358"/>
      <stop offset="0.55" stop-color="#0a1426"/>
      <stop offset="1" stop-color="#04060b"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0.55" stop-color="#ffc531" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffc531" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff4c4"/>
      <stop offset="0.45" stop-color="#ffc531"/>
      <stop offset="1" stop-color="#b9780a"/>
    </linearGradient>
    <linearGradient id="socket" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a3550"/>
      <stop offset="1" stop-color="#0b111c"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4a0616"/>
      <stop offset="0.35" stop-color="#9a1030"/>
      <stop offset="0.6" stop-color="#7a0b25"/>
      <stop offset="1" stop-color="#3c0411"/>
    </linearGradient>
    <radialGradient id="top" cx="42%" cy="30%" r="75%">
      <stop offset="0" stop-color="#ff7d93"/>
      <stop offset="0.4" stop-color="#e01b46"/>
      <stop offset="1" stop-color="#8d0c28"/>
    </radialGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#ffe08a"/>
      <stop offset="1" stop-color="#ffc531"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <g transform="translate(0 -48)">
  <!-- goldener Lichtring -->
  <ellipse cx="512" cy="600" rx="400" ry="298" fill="none" stroke="#ffc531" stroke-width="40" opacity="0.6" filter="url(#soft)"/>
  <ellipse cx="512" cy="600" rx="396" ry="294" fill="url(#gold)"/>
  <ellipse cx="512" cy="596" rx="364" ry="264" fill="url(#socket)"/>
  <!-- Schatten des Knopfs im Sockel -->
  <ellipse cx="512" cy="640" rx="320" ry="200" fill="#000" opacity="0.6" filter="url(#soft)"/>
  <!-- Knopf: Seite -->
  <path d="M192 470 V 575 A 320 220 0 0 0 832 575 V 470 Z" fill="url(#side)"/>
  <!-- Knopf: Oberseite -->
  <ellipse cx="512" cy="470" rx="320" ry="220" fill="url(#top)"/>
  <ellipse cx="512" cy="470" rx="320" ry="220" fill="none" stroke="#ff9aab" stroke-opacity="0.5" stroke-width="6"/>
  <!-- Glanz -->
  <ellipse cx="455" cy="355" rx="190" ry="72" fill="url(#gloss)" transform="rotate(-8 455 355)"/>
  <!-- Blitz, perspektivisch -->
  <g transform="translate(512 470) scale(6.0 3.9) skewX(-6) translate(-54 -50)">
    <path d="M62 2 30 52h18L36 98 78 40H56z" fill="#5a0618" opacity="0.55" transform="translate(1.6 2.4)"/>
    <path d="M62 2 30 52h18L36 98 78 40H56z" fill="url(#bolt)" stroke="#fff6d6" stroke-width="1.4" stroke-linejoin="round"/>
  </g>
  </g>
</svg>
