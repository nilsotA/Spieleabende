<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quizduell – Fragen-Editor</title>
<link rel="stylesheet" href="/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath d='M62 2 30 52h18L36 98 78 40H56z' fill='%23e01b46'/%3E%3C/svg%3E">
<style>
  main { max-width: 1100px; margin: 0 auto; padding: 2rem 1.2rem 5rem; }
  h1 { font-size: 1.6rem; margin: 0 0 .3rem; }
  /* Der Schriftzug ist hier Herkunftszeichen, nicht Bühne: eine Spur größer als
     die Überschrift, sonst hält er sich zurück. */
  .editor-logo { font-size: 1.5rem; flex: none; margin-right: .5rem; }
  /* Auf einem hochkant gehaltenen Tablet blieben dem Namensfeld 110 Pixel –
     der Platzhalter „Name des Fragensatzes" braucht 156. Statt ihn abzuschneiden
     bricht die Zeile jetzt um: Feld und Auswahl behalten eine lesbare Breite,
     die Knöpfe rutschen darunter. */
  #set-name, #load-select { flex: 1 1 14rem; min-width: 0; }
  .bar { position: sticky; top: 0; z-index: 10; background: rgba(5,7,12,.94);
         backdrop-filter: blur(6px); padding: .8rem 0; margin-bottom: 1.2rem;
         border-bottom: 1px solid var(--line); }
  /* Zusammengerückt, sobald man im Formular ist.

     48 Fragen sind ein langes Formular – 7000 Pixel. Die Leiste klebt oben,
     damit Speichern und Fortschritt immer zur Hand sind, kostete dabei aber
     202px: auf einem 720er-Laptop 28 Prozent des Bildes, dauerhaft. Überschrift,
     Untertitel und der Hinweis auf den Dateinamen sagen einem beim Tippen der
     34. Frage nichts mehr – die blenden sich aus, das Namensfeld, die Knöpfe
     und der Fortschritt bleiben. */
  .bar.eng > .row:first-child { display: none; }
  .bar.eng #ziel-datei { display: none; }
  .bar.eng > .row { margin-top: 0 !important; }
  .bar.eng .fortschritt { margin-top: .5rem; }
  .round { margin-bottom: 2rem; }
  .round > h2 { display: flex; align-items: center; gap: .6rem; }
  .round-mult { font-size: .72rem; color: var(--red-1); }
  .cats { display: grid; gap: 1rem; }
  .cat-card { border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: rgba(255,255,255,.02); }
  .cat-head { display: flex; gap: .6rem; align-items: center; padding: .6rem .8rem;
              background: linear-gradient(180deg, rgba(224,27,70,.85), rgba(141,12,40,.85)); }
  .cat-head input { background: rgba(0,0,0,.25); border-color: rgba(255,255,255,.25); font-weight: 800;
                    text-transform: uppercase; letter-spacing: .06em; }
  .qrow { display: grid; grid-template-columns: 4.2rem 1fr 1fr auto; gap: .5rem; align-items: start;
          padding: .55rem .8rem; border-top: 1px solid var(--line); }
  .qrow .val { font-family: var(--font-num); font-style: italic; color: #7fb6f0; padding-top: .55rem; }
  /* Zwei Zeilen statt einer: Die mitgelieferten Fragen sind im Schnitt deutlich
     länger als die ~60 Zeichen, die in eine Zeile passen – man tippte bisher
     blind in einen Schlitz. */
  .qrow textarea { min-height: 4rem; resize: vertical; line-height: 1.35; }
  .fortschritt { display: block; width: 100%; margin-top: .7rem; padding: .4rem .7rem; text-align: left;
                 background: rgba(255,255,255,.04); border: 1px solid var(--line); border-radius: 10px;
                 color: var(--muted); font: inherit; font-size: .82rem; cursor: pointer; position: relative;
                 overflow: hidden; }
  .fortschritt:hover { border-color: #4f9bec; }
  .fortschritt.fertig { color: #7ff0b8; border-color: rgba(37,201,125,.5); cursor: default; }
  /* transform statt width: Der Balken wird bei jedem Tastendruck neu gesetzt,
     und width löst dabei jedes Mal einen Layout-Durchlauf in einer sticky
     Leiste aus. Skalieren kostet nichts. */
  .fortschritt-balken { position: absolute; inset: 0 0 0 0; background: rgba(79,155,236,.18);
                        transform: scaleX(0); transform-origin: 0 50%;
                        transition: transform .25s ease; }
  .fortschritt.fertig .fortschritt-balken { background: rgba(37,201,125,.16); }
  .fortschritt span:last-child { position: relative; }
  .luecke { outline: 2px solid #f8d548 !important; outline-offset: 2px; }
  .fortschritt-lang { margin: .45rem 0 0; font-size: .8rem; color: #f0c65a; }
  .fortschritt-verraet { display: block; margin: .45rem 0 0; padding: 0; border: 0; background: none;
                         font: inherit; font-size: .8rem; color: #ffbecb; text-align: left;
                         cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
  /* Die betroffene Zeile bekommt eine Kante, damit man sie im langen Formular
     wiederfindet – kein roter Kasten, es ist ein Hinweis und kein Fehler. */
  .qrow.verraet { box-shadow: inset 3px 0 0 rgba(242,109,132,.85); }
  /* Sehr lange Frage: nur ein warmer Rand, kein Fehler – manchmal muss eine
     Frage eben lang sein. */
  .qrow > textarea.zulang { border-color: rgba(240, 198, 90, .55); }
  /* Die Kopfleiste klebt oben und ist rund 10rem hoch – ohne dieses Polster
     springt „Zur nächsten Lücke" genau dahinter. */
  html { scroll-padding-top: 11rem; }
  .speicher-warnung { margin: 0 0 1rem; padding: .7rem .9rem; border-radius: 10px;
                      background: rgba(224,27,70,.16); border: 1px solid rgba(255,120,145,.55);
                      color: #ffd7de; font-size: .92rem; line-height: 1.45; }
  .qrow .antwort { display: grid; gap: .35rem; }
  .qrow .notiz { font-size: .82rem; padding: .35rem .5rem; opacity: .75; }
  .qrow .notiz:focus { opacity: 1; }
  .qrow .img-btn { display: flex; flex-direction: column; gap: .3rem; }
  .qrow img { max-width: 90px; max-height: 60px; border-radius: 6px; border: 2px solid #fff; background: #fff; }
  @media (max-width: 760px) { .qrow { grid-template-columns: 1fr; } .qrow .val { padding-top: 0; } }
  /* host.css mit seinem Reduced-Motion-Block wird hier nicht geladen. */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: .01ms !important;
    }
  }
</style>
</head>
<body>
<main>
  <div class="bar">
    <div class="row">
      <!-- Der Editor sah aus wie ein anderes Programm: nackte Überschrift, sonst
           nichts vom Haus. Der Schriftzug steht auch hier – klein, damit er
           nicht mit der Arbeit konkurriert, und beim Scrollen blendet er sich
           mit der übrigen Kopfzeile ohnehin aus. -->
      <div class="logo editor-logo" aria-hidden="true"><span>Quiz</span><span>Duell</span></div>
      <div class="grow">
        <h1>Fragen-Editor</h1>
        <p class="muted small" style="margin:0">6 Kategorien × 4 Fragen pro Runde. Runde 2 zählt automatisch doppelt.</p>
      </div>
      <a class="btn btn-ghost btn-sm" href="/host">← Host-Screen</a>
    </div>
    <div class="row" style="margin-top:.8rem">
      <input id="set-name" class="grow" aria-label="Name des Fragensatzes" placeholder="Name des Fragensatzes" maxlength="80">
      <select id="load-select" class="grow" aria-label="Vorhandenen Fragensatz laden"></select>
      <button id="btn-load" class="btn btn-ghost btn-sm" type="button">Laden</button>
      <label class="btn btn-ghost btn-sm datei-knopf" style="margin:0;cursor:pointer">
        Datei öffnen <input id="file-input" type="file" accept="application/json" aria-label="Fragensatz aus einer Datei öffnen">
      </label>
      <button id="btn-download" class="btn btn-ghost btn-sm" type="button">Herunterladen</button>
      <button id="btn-save" class="btn btn-primary btn-sm" type="button">Auf dem Server speichern</button>
      <span id="ziel-datei" class="muted small" style="flex-basis:100%"></span>
    </div>
    <button id="fortschritt" class="fortschritt" type="button" title="Zur nächsten Lücke springen">
      <span id="fortschritt-balken" class="fortschritt-balken"></span>
      <span id="fortschritt-text"></span>
    </button>
    <!-- Kein Hindernis beim Speichern, nur ein Hinweis: Auf der Leinwand wird
         die Schrift heruntergerechnet, bis alles draufpasst, und bei einem
         ganzen Absatz ist sie aus vier Metern nicht mehr zu lesen. -->
    <p id="fortschritt-lang" class="fortschritt-lang" hidden></p>
    <!-- Der teuerste Fehler beim Fragenschreiben: Die Lösung steht in der
         Nachbarfrage derselben Kategorie und ist auf der Leinwand verschenkt. -->
    <button id="fortschritt-verraet" class="fortschritt-verraet" type="button" hidden></button>
  </div>
  <!-- Marke direkt unter der Leiste. Woran erkannt wird, ob man schon im
       Formular ist, darf sich nicht dadurch ändern, dass die Leiste zusammen-
       rückt: Schrumpft sie, wird die Seite um denselben Betrag kürzer, und der
       Browser zieht den Scrollwert nach, um den Inhalt an Ort und Stelle zu
       halten. Gegen `scrollY` gemessen klappte die Leiste deshalb endlos auf
       und zu. Diese Marke bleibt bei genau dem Nachziehen stehen. -->
  <div id="bar-marke" aria-hidden="true"></div>

  <!-- Bleibt stehen, solange der Zwischenspeicher voll ist. Ein Toast wäre nach
       drei Sekunden weg, und danach sähe der Editor wieder gesund aus. -->
  <div id="speicher-warnung" class="speicher-warnung" role="alert" hidden>
    <strong>Zwischenspeicher voll.</strong> Es wird gerade <em>nichts</em> mehr automatisch
    gesichert – meist liegt das an vielen eingebetteten Bildern. Bitte jetzt
    „Herunterladen“ oder „Auf dem Server speichern“.
  </div>

  <div id="rounds"></div>

  <div class="row" style="justify-content:center;margin-top:1.5rem">
    <button id="btn-add-round" class="btn btn-ghost" type="button">+ Weitere Runde</button>
  </div>
</main>

<div id="toasts"></div>
<script type="module" src="/editor.js"></script>
</body>
</html>
