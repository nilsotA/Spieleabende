<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05070c">
<title>Quizduell – Fernbedienung</title>
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/player.css">
<link rel="stylesheet" href="/remote.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath d='M62 2 30 52h18L36 98 78 40H56z' fill='%23e01b46'/%3E%3C/svg%3E">
</head>
<body class="remote">

<div id="offline" class="offline" role="status" aria-live="polite" hidden>Verbindung verloren – versuche neu zu verbinden …</div>

<main id="app">
  <header class="rhead">
    <div class="logo" style="font-size:1.5rem"><span>Quiz</span><span>Duell</span></div>
    <span class="rtag">Fernbedienung</span>
  </header>

  <div id="r-phase" class="r-phase" role="status" aria-live="polite">Verbinde …</div>

  <!-- Pause: oben, weil sie zwischen zwei Fragen gedrückt wird und nicht in der
       Hektik einer Wertung. In der Pause wird sie zum Hauptknopf – dann ist sie
       das Einzige, was der Host noch tun will. -->
  <button id="r-pause" class="btn r-pause" type="button" hidden>⏸ Pause</button>

  <!-- Feldwahl: damit der Host zum Aufrufen nicht an den Laptop zurückmuss -->
  <section id="r-board" class="r-card r-board" hidden aria-labelledby="r-board-titel">
    <h2 id="r-board-titel">Feld aufrufen</h2>
    <div id="r-board-list"></div>
  </section>

  <!-- Frage samt Lösung – dieses Gerät sieht niemand außer dem Host -->
  <section id="r-question" class="r-card" hidden>
    <div id="r-cat" class="r-cat"></div>
    <div id="r-text" class="r-text"></div>
    <img id="r-image" class="r-image" alt="" hidden>
    <div class="r-answer-box">
      <span class="r-answer-label">Lösung</span>
      <div id="r-answer" class="r-answer"></div>
      <div id="r-note" class="r-note" hidden></div>
    </div>
    <div id="r-log" class="r-log"></div>
    <!-- „Frage verwerfen" steht bewusst hier oben am Fragenkasten und nicht
         unten bei den Wertungsknöpfen: Der Daumen ist beim Werten unten
         unterwegs, und dies ist kein Zug, den man nebenbei macht. -->
    <button id="r-discard" class="btn btn-ghost r-discard" type="button" hidden>
      Frage verwerfen – Feld bleibt offen
    </button>
  </section>

  <!-- Zurücknehmen und die Wertungsknöpfe kleben gemeinsam unten. Getrennt
       geklebt lag „Zurücknehmen" im Fluss und die Wertungsleiste darüber: Der
       Knopf war durch den durchsichtigen Rand des Verlaufs noch zu sehen, sein
       Tipp landete aber auf „Richtig" – gemessen wurden dabei 100 Punkte
       vergeben. Zwei Bahnen bleiben es trotzdem. -->
  <div class="r-foot">
    <button id="r-undo" class="btn r-undo" type="button" hidden>↩ Zurücknehmen</button>
    <div id="r-buttons" class="r-buttons"></div>
  </div>

  <section class="r-card r-scores">
    <h2>Punkte</h2>
    <ul id="r-teams" class="r-teams"></ul>
  </section>

  <p class="muted small" style="text-align:center">
    Diese Seite ist nur für dich – auf dem Beamer bleibt die Lösung verdeckt.
  </p>
</main>

<!-- Die Meldungen dieser Seite (Fehler, Bestätigungen) waren nur zu sehen,
     nie zu hören: „Bitte trag deinen Namen ein." blieb einer Vorlesehilfe
     verborgen. `polite`, damit es nicht mitten in einen Satz platzt. -->
<div id="toasts" role="status" aria-live="polite"></div>
<script type="module" src="/remote.js"></script>
</body>
</html>
