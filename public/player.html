<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#05070c">
<meta name="mobile-web-app-capable" content="yes">
<title>Quizduell – Buzzer</title>
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/player.css">
<!-- Wacht darüber, dass hier nie eine leere Seite stehen bleibt. Gewöhnliches
     Skript, kein Modul: Es läuft vor allem anderen und überlebt dessen Absturz. -->
<script src="/start-wache.js"></script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath d='M62 2 30 52h18L36 98 78 40H56z' fill='%23e01b46'/%3E%3C/svg%3E">
</head>
<body>

<div id="offline" class="offline" role="status" aria-live="polite" hidden>Verbindung verloren – versuche neu zu verbinden …</div>

<main id="app">

  <!-- Anmeldung -->
  <section id="view-join" class="screen">
    <div class="logo" style="font-size:2.4rem"><span>Quiz</span><span>Duell</span></div>
    <!-- novalidate: Die Blase des Browsers spricht die Sprache seiner
         Oberfläche, nicht die der Seite – auf einem englisch eingestellten
         Handy stand mitten im deutschen Formular „Please fill out this field.".
         Den fehlenden Namen meldet stattdessen derselbe Hinweis wie das
         fehlende Team. `required` bleibt für Vorlesehilfen stehen. -->
    <form id="join-form" class="card join-card" novalidate>
      <div>
        <label for="my-name">Dein Name</label>
        <input id="my-name" maxlength="24" autocomplete="nickname" placeholder="z.B. Nils" required>
      </div>
      <div>
        <label>Team</label>
        <div id="team-choices" class="team-choices"></div>
      </div>
      <button class="btn btn-primary btn-block" type="submit">Mitspielen</button>
      <p id="join-hint" class="muted small"></p>
      <!-- Diese Zeile ist nie leer. Sie sagt vom ersten Augenblick an, wie es um
           die Verbindung steht – im Fließtext und nicht als Balken am oberen
           Rand, wo eine Notch ihn verdecken kann. Genau dieser Satz hat an
           einem Abend gefehlt: Die Anmeldung stand da, ohne Teams und ohne ein
           Wort dazu, und niemand konnte sagen, ob es am Handy lag, am WLAN
           oder am Gastgeber. -->
      <p id="verbindung" class="verbindung" role="status" aria-live="polite">Verbinde mit dem Spiel …</p>
      <!-- Und für den Fall, dass es doch jemand genauer wissen muss: sechs
           Zeilen zum Abfotografieren. -->
      <button id="btn-lage" class="btn btn-ghost btn-sm" type="button">Was ist los?</button>
      <div id="lagebericht" class="lagebericht" hidden></div>
    </form>
  </section>

  <!-- Spielansicht -->
  <section id="view-play" class="screen">
   <div class="pscroll">
    <header class="phead">
      <div>
        <div id="p-team" class="p-team">—</div>
        <div id="p-name" class="muted small">—</div>
      </div>
      <!-- Die Hülle trägt den fliegenden Punktesprung. In die Pille selbst darf
           er nicht: Ihre Zahl läuft beim Werten hoch, und jedes Hochzählen
           schreibt `textContent` neu – der Flieger wäre im nächsten Bild weg. -->
      <div class="p-score-box">
        <div id="p-score" class="p-score">0</div>
      </div>
    </header>

    <!-- Wappen aussuchen. Nur in der Lobby zu sehen: Sobald gespielt wird, ist
         das Wappen das Erkennungszeichen auf der Leinwand und bleibt stehen. -->
    <div id="p-wappen" class="p-wappen" hidden></div>

    <!-- Steht nur da, wenn dieses Gerät den Bildschirm nicht wachhalten kann –
         siehe schlafHinweis() in player.js. -->
    <p id="p-schlaf" class="p-schlaf" hidden></p>

    <div id="p-status" class="p-status" role="status" aria-live="polite">Warte auf den Host …</div>

    <!-- Feldauswahl, wenn man dran ist -->
    <div id="p-picker" class="picker" hidden></div>

    <!-- Frage -->
    <div id="p-question" class="p-question" hidden>
      <div id="p-q-head" class="p-q-head"></div>
      <div id="p-q-text" class="p-q-text"></div>
      <img id="p-q-image" class="p-q-image" alt="" hidden>
      <div id="p-q-answer" class="p-q-answer" hidden></div>
      <p id="p-q-note" class="p-q-note" hidden></p>
    </div>

    <!-- Eigene Bilanz – nur in den Pausen, in denen ohnehin gewartet wird -->
    <div id="p-bilanz" class="p-bilanz" hidden></div>

    <div id="p-scores" class="p-scores"></div>
   </div>

    <!-- Die ganze freie Fläche zählt als Buzzer: im Eifer trifft man den Kreis
         nicht zuverlässig. Der Knopf bleibt trotzdem sichtbar der Anker.
         Bewusst nie `disabled`: deaktivierte Buttons feuern keine Events, dann
         bliebe ein zu früher Druck unkommentiert und ein schon aufliegender
         Daumen würde die Freigabe verpassen. -->
    <div id="buzz-zone" class="buzz-zone">
      <button id="buzzer" class="buzzer locked" type="button">
        <span class="bolt">⚡</span>
        <span id="buzzer-label" class="buzzer-label">BUZZ</span>
      </button>
    </div>

    <div class="p-fuss">
      <button id="btn-leave" class="btn btn-ghost btn-sm">Team wechseln</button>
      <button id="btn-ton" class="btn btn-ghost btn-sm" title="Töne auf diesem Handy" aria-label="Töne auf diesem Handy an oder aus">🔊</button>
    </div>
  </section>

</main>

<!-- Die Meldungen dieser Seite (Fehler, Bestätigungen) waren nur zu sehen,
     nie zu hören: „Bitte trag deinen Namen ein." blieb einer Vorlesehilfe
     verborgen. `polite`, damit es nicht mitten in einen Satz platzt. -->
<div id="toasts" role="status" aria-live="polite"></div>
<script type="module" src="/player.js"></script>
</body>
</html>
